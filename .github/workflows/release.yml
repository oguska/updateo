name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CC_x86_64_unknown_linux_musl: musl-gcc
  AR_x86_64_unknown_linux_musl: ar
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::could not read package.version from Cargo.toml"
            exit 1
          fi
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml (v$version)"
            exit 1
          fi
          echo "UPDATEO_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: cargo test --all-targets --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build native release for e2e probes
        run: cargo build --release --locked

      - name: Run PTY end-to-end probes
        run: sh .e2e/probes.sh

      - name: Build static musl release
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify static binary
        run: |
          binary=target/x86_64-unknown-linux-musl/release/updateo
          file "$binary"
          if ! file "$binary" | grep -q 'static'; then
            echo "::error::$binary is not statically linked"
            exit 1
          fi

      - name: Package release
        run: |
          set -eu
          asset="updateo-${UPDATEO_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "dist/$asset"
          cp target/x86_64-unknown-linux-musl/release/updateo "dist/$asset/updateo"
          cp README.md README.en.md CHANGELOG.md "dist/$asset/"
          tar -C dist -czf "dist/$asset.tar.gz" "$asset"
          (cd dist && sha256sum "$asset.tar.gz" > SHA256SUMS)

          if ! grep -q "^## ${UPDATEO_VERSION}\([[:space:]]\|$\)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${UPDATEO_VERSION}"
            exit 1
          fi
          awk -v v="$UPDATEO_VERSION" '
            index($0, "## " v) == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          sed -i '/./,$!d' dist/release-notes.md

          cat >> dist/release-notes.md <<EOF

          ### Install

          \`\`\`sh
          tar -xzf ${asset}.tar.gz
          sudo install -Dm755 ${asset}/updateo /usr/local/bin/updateo
          updateo
          \`\`\`

          The binary is statically linked (musl) and does not need a Rust toolchain.
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: updateo ${{ env.UPDATEO_VERSION }}
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
