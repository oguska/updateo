[package]
name = "updateo"
version = "0.2.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4.35", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.110"
tui-big-text = "0.8.10"
tui-input = "0.15.5"
tui-popup = "0.7.7"
tui-scrollbar = "0.2.8"
